name: Repair Vanilla original installer client checksum

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/publish-original-installer.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace only incorrect client ZIP SHA-256 in published Vanilla installer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import hashlib
          p=Path("download/DawnForgeLauncherSetup.exe")
          data=p.read_bytes()
          old_sha=b"8a91accc8d6c06d21b59df94130966e607a1bea1f002a0bfb411cfc9384e3ecd"
          new_sha=b"481a61c9f61182b6485edc1dc2bb7e3911e1d82fabbcb399542d131e60d9ee83"
          url=b"https://dawnforge.eu/download/DawnForge-1.12.1.zip?v=1111"
          if data[:2]!=b"MZ" or len(data)!=10605568: raise SystemExit("Unexpected original Vanilla installer; refusing to modify")
          if data.count(url)!=1: raise SystemExit("Expected client ZIP download URL not found exactly once")
          if data.count(old_sha)==1 and data.count(new_sha)==0:
              patched=data.replace(old_sha,new_sha)
          elif data.count(old_sha)==0 and data.count(new_sha)==1:
              patched=data
          else: raise SystemExit("Unexpected client checksum state; refusing to modify")
          if len(patched)!=len(data) or patched.count(new_sha)!=1: raise SystemExit("Checksum correction validation failed")
          p.write_bytes(patched)
          for name in ("DawnForgeLauncherSetup.zip","DawnForgeLauncherSetup_v1.0.12.zip"):
              with ZipFile(Path("download")/name,"w",compression=ZIP_DEFLATED,compresslevel=9) as z:
                  z.write(p,arcname="DawnForgeLauncherSetup.exe")
          print("EXPECTED CLIENT ZIP SHA256",new_sha.decode())
          print("FIXED INSTALLER SHA256",hashlib.sha256(patched).hexdigest())
          PY
      - name: Publish repaired Vanilla installer without changing the launcher appearance
        run: |
          git config user.name "DawnForge Bot"
          git config user.email "actions@users.noreply.github.com"
          git add download/DawnForgeLauncherSetup.exe download/DawnForgeLauncherSetup.zip download/DawnForgeLauncherSetup_v1.0.12.zip
          if git diff --cached --quiet; then
            echo "Vanilla installer already repaired."
          else
            git commit -m "Correct Vanilla client archive checksum in original installer"
            git push
          fi
