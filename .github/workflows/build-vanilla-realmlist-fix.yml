name: Build independent Vanilla realmlist fixer
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/vanilla-realmlist-fix/**"
      - ".github/workflows/build-vanilla-realmlist-fix.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Compile isolated realmlist repair utility
        shell: pwsh
        run: |
          cd tools/vanilla-realmlist-fix
          go build -trimpath -ldflags "-s -w -H windowsgui" -o ../../download/DawnForgeRealmlistFix.exe .
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }
      - name: Verify repair against a synthetic Vanilla game folder
        shell: pwsh
        run: |
          $dir=Join-Path $env:RUNNER_TEMP 'VanillaFixture'
          New-Item -Force -ItemType Directory $dir | Out-Null
          Set-Content -Path (Join-Path $dir 'Wow.exe') -Value 'fixture'
          Set-Content -Path (Join-Path $dir 'realmlist.wtf') -Value 'set realmlist dawnforge.eu'
          & ./download/DawnForgeRealmlistFix.exe --silent $dir
          if ((Get-Content (Join-Path $dir 'realmlist.wtf') -Raw).Trim() -ne 'set realmlist play.dawnforge.eu') { throw 'Fix did not work' }
      - name: Publish only standalone repair tool
        shell: pwsh
        run: |
          git config user.name "DawnForge Bot"
          git config user.email "actions@users.noreply.github.com"
          git add download/DawnForgeRealmlistFix.exe
          if (-not (git diff --cached --quiet)) {
            git commit -m "Publish Vanilla realmlist repair utility"
            git push
          }
