name: Restore original DawnForge Vanilla installer
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/publish-vanilla-realm-wrapper.yml"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original installer unchanged
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, zipfile
          original = Path("download/DawnForgeOriginalSetup.exe")
          target = Path("download/DawnForgeLauncherSetup.exe")
          expected = "78fca7473aa826d4cb80593bdd62f11adda0a66569eb673d334d200677956636"
          raw = original.read_bytes()
          checksum = hashlib.sha256(raw).hexdigest()
          if len(raw) != 10605568 or checksum != expected:
              raise SystemExit("Original installer backup is unexpected; refusing to restore")
          target.write_bytes(raw)
          for filename in ("DawnForgeLauncherSetup.zip", "DawnForgeLauncherSetup_v1.0.12.zip"):
              with zipfile.ZipFile(Path("download")/filename, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
                  z.write(target, arcname="DawnForgeLauncherSetup.exe")
          assert hashlib.sha256(target.read_bytes()).hexdigest() == expected
          print("Original Vanilla installer restored:",checksum)
          PY
      - name: Publish restored original only
        run: |
          git config user.name "DawnForge Bot"
          git config user.email "actions@users.noreply.github.com"
          git add download/DawnForgeLauncherSetup.exe download/DawnForgeLauncherSetup.zip download/DawnForgeLauncherSetup_v1.0.12.zip
          if ! git diff --cached --quiet; then
            git commit -m "Restore original Vanilla launcher without wrapper"
            git push
          fi
