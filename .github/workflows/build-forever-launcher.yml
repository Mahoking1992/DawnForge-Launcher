name: Build DawnForge Forever Launcher (independent)

on:
  workflow_dispatch:
  push:
    branches: ["forever/play-connector-70"]
    paths:
      - "forever/**"
      - "!forever/update-manifest.json"
      - ".github/workflows/build-forever-launcher.yml"

permissions:
  contents: write

jobs:
  build-forever:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Verify the bundled Forever connector
        shell: pwsh
        run: |
          $expected = (Get-Content forever/connector/SHA256SUMS -Raw).Split(' ')[0].Trim().ToLowerInvariant()
          $actual = (Get-FileHash forever/app/forever-connector.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Bundled Forever connector SHA-256 mismatch" }
          if ($expected.Length -ne 64) { throw "Invalid bundled connector digest" }
      - name: Verify approved full-resolution artwork and unpack blue D icon
        shell: pwsh
        run: |
          $expectedArt = "46dadd7161e637ac827d4bb68312ec684448f9e238f68c45afe796d5e14d3a03"
          $actualArt = (Get-FileHash forever/app/artwork.jpg -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualArt -ne $expectedArt) { throw "The approved Alliance/Horde artwork is missing or changed." }
          $expectedIcon = "c5583fbe60aa016c189e9a233686848ff56cf0a4b9d424b5b6c403b8237171ed"
          $actualIcon = (Get-FileHash forever/assets/blue-icon.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualIcon -ne $expectedIcon) { throw "Blue D icon archive is missing or changed." }
          Expand-Archive -LiteralPath forever/assets/blue-icon.zip -DestinationPath forever/app -Force
          if (-not (Test-Path forever/app/icon.ico)) { throw "Blue D icon is missing." }
      - name: Validate PowerShell launcher source
        shell: pwsh
        run: |
          $text = Get-Content forever/app/launcher.ps1 -Raw
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseInput($text,[ref]$tokens,[ref]$errors)|Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Host
            exit 1
          }
          if ($text -match 'Gateway hostname.*TextBox|SECURE UPDATES  •') { throw "Old technical Options or footer text remains." }
          if ($text.Contains('Background="#F0081524"') -or $text.Contains('Background="#E9081524"')) { throw "Transparent status cards cause text overlap." }
          if (($text | Select-String -Pattern 'Background="#FF081524"' -AllMatches).Matches.Count -lt 2) { throw "Opaque status masks are missing." }
      - name: Embed blue D Windows executable icon
        shell: pwsh
        run: |
          go install github.com/akavel/rsrc@v0.10.2
          $rsrc = Join-Path (go env GOPATH) 'bin/rsrc.exe'
          if (-not (Test-Path $rsrc)) { throw "Windows icon resource tool unavailable." }
          Push-Location forever/app
          & $rsrc -ico icon.ico -o rsrc.syso
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path rsrc.syso)) { throw "Icon resource compilation failed." }
          Pop-Location
      - name: Build standalone Windows executable
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          Push-Location forever/app
          go build -trimpath -ldflags "-s -w -H windowsgui" -o "../../download/DawnForgeForeverLauncher.exe" .
          if ($LASTEXITCODE -ne 0) { throw "Windows build failed." }
          Pop-Location
          if (-not (Test-Path download/DawnForgeForeverLauncher.exe)) { throw "Executable was not created." }
          Get-FileHash download/DawnForgeForeverLauncher.exe -Algorithm SHA256
      - name: Publish only Forever EXE and update manifest to main
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $releaseDir = Join-Path $env:RUNNER_TEMP "dawnforge-forever-main"
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw "Cannot fetch main" }
          git worktree add -b forever-release-022 $releaseDir origin/main
          if ($LASTEXITCODE -ne 0) { throw "Cannot check out release worktree" }
          $sourceExe = Join-Path $pwd "download/DawnForgeForeverLauncher.exe"
          $targetExe = Join-Path $releaseDir "download/DawnForgeForeverLauncher.exe"
          Copy-Item -LiteralPath $sourceExe -Destination $targetExe -Force
          $sha = (Get-FileHash -LiteralPath $targetExe -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifestPath = Join-Path $releaseDir "forever/update-manifest.json"
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $manifest.launcher.version = "0.2.3"
          $manifest.launcher.url = "https://raw.githubusercontent.com/Mahoking1992/DawnForge-Launcher/main/download/DawnForgeForeverLauncher.exe"
          $manifest.launcher.sha256 = $sha
          $manifest | ConvertTo-Json -Depth 10 | Set-Content $manifestPath -Encoding utf8
          git -C $releaseDir config user.name "DawnForge Forever Bot"
          git -C $releaseDir config user.email "actions@users.noreply.github.com"
          git -C $releaseDir add download/DawnForgeForeverLauncher.exe forever/update-manifest.json
          $changed = @(git -C $releaseDir diff --cached --name-only)
          $allowed = @("download/DawnForgeForeverLauncher.exe", "forever/update-manifest.json")
          foreach ($f in $changed) { if ($f -notin $allowed) { throw "Unexpected staged file $f" } }
          if ($changed.Count -eq 0) { Write-Host "Forever release already current"; exit 0 }
          git -C $releaseDir commit -m "Publish Forever ZIP installer launcher 0.2.3"
          if ($LASTEXITCODE -ne 0) { throw "Cannot commit release" }
          git -C $releaseDir push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "Cannot publish release to main" }
          Write-Host "PUBLISHED Forever 0.2.2 SHA256 $sha"
