name: Build DawnForge Forever Launcher (independent)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "forever/**"
      - "!forever/update-manifest.json"
      - ".github/workflows/build-forever-launcher.yml"

  pull_request:
    branches: [main]
    paths:
      - "forever/**"
      - ".github/workflows/build-forever-launcher.yml"

permissions:
  contents: write

jobs:
  build-forever:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Verify approved full-resolution artwork and unpack blue D icon
        shell: pwsh
        run: |
          $expectedArt = "46dadd7161e637ac827d4bb68312ec684448f9e238f68c45afe796d5e14d3a03"
          $actualArt = (Get-FileHash forever/app/artwork.jpg -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualArt -ne $expectedArt) { throw "The approved Alliance/Horde artwork is missing or changed." }
          $expectedIcon = "c5583fbe60aa016c189e9a233686848ff56cf0a4b9d424b5b6c403b8237171ed"
          $actualIcon = (Get-FileHash forever/assets/blue-icon.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualIcon -ne $expectedIcon) { throw "Blue D icon archive is missing or changed." }
          Expand-Archive -LiteralPath forever/assets/blue-icon.zip -DestinationPath forever/app -Force
          if (-not (Test-Path forever/app/icon.ico)) { throw "Blue D icon is missing." }
      - name: Verify pinned Nov-11 connector and certificate profile
        shell: pwsh
        run: |
          $expected = "691cb9e017d47311839d4248d3a41265ef5bd1273b271987e429a23bd86b84f5"
          $real = (Get-FileHash forever/app/forever-connector.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($real -ne $expected) { throw "Bundled Forever connector checksum mismatch." }
          $published = (Get-Content forever/connector/SHA256SUMS -Raw).Split(' ')[0].Trim()
          if ($published -ne $expected) { throw "Connector checksum file differs from approved hash." }
          $profile = Get-Content forever/connector/profile.h -Raw
          if ($profile -notmatch 'play.dawnforge.eu' -or $profile -notmatch 'DawnForge Forever') {
            throw "Wrong Forever connector profile."
          }
      - name: Validate native launcher source and compile
        shell: pwsh
        run: |
          if (Select-String -Path forever/app/*.go -Pattern 'powershell.exe','-ExecutionPolicy','cmd.exe' -SimpleMatch) { throw "Script host call forbidden." }
          Push-Location forever/app
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw "Go test failed." }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw "Go vet failed." }
          Pop-Location
      - name: Embed blue D Windows executable icon
        shell: pwsh
        run: |
          go install github.com/akavel/rsrc@v0.10.2
          $rsrc = Join-Path (go env GOPATH) 'bin/rsrc.exe'
          if (-not (Test-Path $rsrc)) { throw "Windows icon resource tool unavailable." }
          Push-Location forever/app
          & $rsrc -ico icon.ico -o rsrc.syso
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path rsrc.syso)) { throw "Icon resource compilation failed." }
          Pop-Location
      - name: Build standalone Windows executable
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          Push-Location forever/app
          go build -trimpath -ldflags "-s -w -H windowsgui" -o "../../download/DawnForgeForeverLauncher.exe" .
          if ($LASTEXITCODE -ne 0) { throw "Windows build failed." }
          Pop-Location
          if (-not (Test-Path download/DawnForgeForeverLauncher.exe)) { throw "Executable was not created." }
          Get-FileHash download/DawnForgeForeverLauncher.exe -Algorithm SHA256
      - name: Smoke-test native Windows GUI
        shell: pwsh
        run: |
          $exe = (Resolve-Path download/DawnForgeForeverLauncher.exe).Path
          $proc = Start-Process -FilePath $exe -PassThru -ErrorAction Stop
          try {
            Start-Sleep -Seconds 5
            $proc.Refresh()
            if ($proc.HasExited) { throw "Native GUI exited immediately with code $($proc.ExitCode)." }
            Write-Host "Native GUI remained active for 5 seconds."
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Set verified launcher update feed
        shell: pwsh
        run: |
          $manifest = Get-Content forever/update-manifest.json -Raw | ConvertFrom-Json
          $manifest.launcher.version = "0.3.1"
          $manifest.launcher.url = "https://raw.githubusercontent.com/Mahoking1992/DawnForge-Launcher/main/download/DawnForgeForeverLauncher.exe"
          $manifest.launcher.sha256 = (Get-FileHash download/DawnForgeForeverLauncher.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest | ConvertTo-Json -Depth 10 | Set-Content forever/update-manifest.json -Encoding utf8
      - name: Scan native build with Windows Defender when available
        shell: pwsh
        run: |
          $exe = (Resolve-Path download/DawnForgeForeverLauncher.exe).Path
          $scanner = Join-Path $env:ProgramFiles "Windows Defender/MpCmdRun.exe"
          if (Test-Path $scanner) {
            & $scanner -Scan -ScanType 3 -File $exe -DisableRemediation
            if ($LASTEXITCODE -ne 0) { throw "Antivirus scan failed." }
            & $scanner -Scan -ScanType 3 -File (Resolve-Path forever/app/forever-connector.exe).Path -DisableRemediation
            if ($LASTEXITCODE -ne 0) { throw "Embedded Forever connector antivirus scan failed." }
          } else {
            Write-Host "::warning::Defender unavailable on runner; scan locally before release."
          }
      - name: Upload downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: DawnForgeForeverLauncher-Windows
          path: download/DawnForgeForeverLauncher.exe
      - name: Publish Forever EXE and manifest without touching Vanilla
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          git config user.name "DawnForge Forever Bot"
          git config user.email "actions@users.noreply.github.com"
          git add download/DawnForgeForeverLauncher.exe forever/update-manifest.json
          if (git diff --cached --quiet) {
            Write-Host "Forever binary and manifest already current."
          } else {
            git commit -m "Publish verified native Forever launcher"
            git push
          }
