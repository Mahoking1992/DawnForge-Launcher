name: Inspect original launcher UPDATE capability (read-only)

on:
  workflow_dispatch:
  push:
    branches: ["feature/hd-r2-autoupdate"]
    paths: [".github/workflows/inspect-original.yml"]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download and extract original launcher package
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full binutils file > /dev/null
          curl -fL --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/Mahoking1992/DawnForge-Launcher/main/download/DawnForgeLauncherSetup.rar" \
            -o /tmp/DawnForgeLauncherSetup.rar
          mkdir -p /tmp/df-original
          7z x -y -o/tmp/df-original /tmp/DawnForgeLauncherSetup.rar >/dev/null
          echo "SETUP PACKAGE FILES:"
          find /tmp/df-original -maxdepth 2 -type f -printf "%P (%s bytes)\\n" | head -35
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          setup=Path("/tmp/df-original/DawnForgeLauncherSetup.exe").read_bytes()
          core=setup[1004416:1004416+8619520]
          assert len(core)==8619520 and core[:2]==b"MZ"
          target=Path("/tmp/df-original/DawnForgeOriginal.exe")
          target.write_bytes(core)
          print("CORE SIZE:",len(core))
          print("CORE SHA256:",hashlib.sha256(core).hexdigest())
          PY
      - name: Inspect executable format, dependencies and update strings
        run: |
          set -euo pipefail
          target=/tmp/df-original/DawnForgeOriginal.exe
          file "$target"
          echo "PE IMPORT DLLS:"
          (objdump -p "$target" | grep -E '^\s*DLL Name: ' | sort -u | head -60) || true
          echo "UPDATE-RELATED STRINGS (ASCII/UTF16, filtered; no full binaries):"
          python3 - <<'PY'
          from pathlib import Path
          import re
          d=Path("/tmp/df-original/DawnForgeOriginal.exe").read_bytes()
          # No execution of Windows binaries. Only printable strings extracted.
          found=[]
          for label,stream in (
            ("ascii",d),
            ("utf16le",d)):
            if label=="ascii":
              strings=re.findall(rb"[\x20-\x7e]{6,260}",stream)
              decoded=[b.decode("ascii","ignore") for b in strings]
            else:
              strings=re.findall(rb"(?:[\x20-\x7e]\x00){6,260}",stream)
              decoded=[b.decode("utf-16-le","ignore") for b in strings]
            for s in decoded:
              lo=s.lower()
              if any(word in lo for word in (
                "update","launcher","version","manifest","github","patch",
                "download","self-update","autoupdate","release","http://","https://",
                "xml","json","software\microsoft\windows\currentversion\run"
              )):
                if len(s)>180:continue
                if "://" in s:
                  # Don't expose unknown tokens or query strings from binaries.
                  s=re.sub(r"([a-zA-Z]+://[^\s?#]+)[^\s]*",r"\1",s)
                found.append((label,s))
          unique=[]
          seen=set()
          for src,s in found:
            if s in seen:continue
            seen.add(s)
            unique.append((src,s))
          print("Matched unique strings:",len(unique))
          for src,s in unique[:140]:
            print(src+":"+s)
          PY

      - name: Focused launcher self-update evidence check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          b=Path("/tmp/df-original/DawnForgeOriginal.exe").read_bytes()
          a=re.findall(rb'[\\x20-\\x7e]{6,800}',b)
          rows=[]
          for line in a:
              try:s=line.decode('ascii')
              except:continue
              low=s.lower()
              if any(p in low for p in (
                  'main.checkforupdate','main.update','main.download',
                  'main.applyupdate','main.selfupdate','main.fetchmanifest',
                  'main.manifest','launcher-update.json','client/manifest.json',
                  'launcherVersion','launcher update','update launcher',
                  'game is up to date','update failed','install complete',
                  'main.(*app)','main.(*launcher)'
              )):
                  if len(s)>300:
                      for term in ('launcher-update.json','client/manifest.json','launcherVersion','update failed','main.checkForUpdate','main.update','main.fetchManifest'):
                          index=low.find(term.lower())
                          if index>=0: rows.append((term,s[max(0,index-100):index+130]))
                  else:rows.append(('',s))
          seen=set()
          for term,s in rows[:130]:
              if s in seen:continue
              seen.add(s)
              print('MATCH:',term,repr(s))
          PY
