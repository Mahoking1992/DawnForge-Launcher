name: Build DawnForge Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "launcher/**"
      - ".github/workflows/build-launcher.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Prepare launcher artwork
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          curl -fL --retry 3 --retry-delay 2             "https://dawnforge.eu/images/dawnforge-launcher-web-full.webp"             -o launcher/background-source.webp
          convert launcher/background-source.webp             -resize 1458x972^ -gravity center -extent 1458x972             -quality 90 launcher/background.jpg
          test -s launcher/background.jpg
          base64 -d launcher/icon64.b64 > launcher/dawnforge.ico
          test -s launcher/dawnforge.ico

      - name: Build Windows launcher
        working-directory: launcher
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go install github.com/akavel/rsrc@latest
          "$(go env GOPATH)/bin/rsrc" -ico dawnforge.ico -o rsrc.syso
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o DawnForgeLauncher.exe .
          test -s DawnForgeLauncher.exe
          sha256sum DawnForgeLauncher.exe

      - name: Publish download files
        run: |
          mkdir -p download
          cp launcher/DawnForgeLauncher.exe download/DawnForgeLauncher.exe
          cd launcher
          zip -9 -j ../download/DawnForgeLauncherSetup.zip DawnForgeLauncher.exe
          cd ..
          SHA="$(sha256sum download/DawnForgeLauncher.exe | awk '{print $1}')"
          cat > download/launcher-update.json <<JSON
          {
            "version": "1.0.10",
            "url": "https://raw.githubusercontent.com/Mahoking1992/DawnForge-Launcher/main/download/DawnForgeLauncher.exe",
            "sha256": "$SHA"
          }
          JSON
          test -s download/DawnForgeLauncherSetup.zip
          cat download/launcher-update.json

      - name: Commit generated launcher
        run: |
          git config user.name "DawnForge Bot"
          git config user.email "actions@users.noreply.github.com"
          git add download/DawnForgeLauncher.exe download/DawnForgeLauncherSetup.zip download/launcher-update.json
          if git diff --cached --quiet; then
            echo "Generated launcher is already current."
          else
            git commit -m "Publish DawnForge Launcher v1.0.10"
            git push
          fi
